[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "uflx-spec-interpreter"
version = "0.1.0"
description = "A numerical reference interpreter and symbolic transformations for UFLx"
requires-python = ">=3.11"
dependencies = ["numpy"]

[project.optional-dependencies]
# Batched Basix tabulation uses jax.pure_callback's vmap_method, added in 0.4.35.
jax = ["fenics-basix", "jax>=0.4.35"]
test = ["pytest", "pytest-xdist", "coverage", "fenics-basix", "jax>=0.4.35"]
lint = ["ruff", "pyright"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
addopts = "-n 6 --import-mode=importlib"

[tool.coverage.run]
branch = true
source = ["uflx", "uflx_basix", "uflx_extensions", "uflx_jax_compiler"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = ["E", "W", "F", "I", "RUF", "UP", "ICN", "NPY", "FLY", "LOG", "ISC"]
# Rule tables bind small local lambdas, and I and l follow the notation of the specification.
ignore = ["E731", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["uflx", "uflx_basix", "uflx_extensions", "uflx_jax_compiler"]

[tool.pyright]
include = ["src/uflx", "src/uflx_extensions"]
exclude = ["src/uflx_jax_compiler", "src/uflx_basix", "test"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
reportUnnecessaryTypeIgnoreComment = "error"
