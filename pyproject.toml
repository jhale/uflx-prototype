[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "uflx-spec-interpreter"
version = "0.1.0"
description = "A toy implementation of the evaluation passes of the UFLx language specification"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest", "coverage"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["test"]

[tool.coverage.run]
branch = true
source = ["uflx_spec_interpreter"]

[tool.coverage.report]
show_missing = true
