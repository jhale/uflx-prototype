[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "uflx-core-experimental"
version = "0.1.0.dev0"
description = "An experimental Python implementation of the UFLx core language"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "fenics-basix",
    "jax",
]

[project.optional-dependencies]
docs = ["sphinx", "pydata-sphinx-theme", "jupytext", "myst-parser"]
test = ["pytest", "pytest-xdist", "coverage"]
lint = ["ruff", "pyright"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uflx = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
addopts = "-n 6 --import-mode=importlib"

[tool.coverage.run]
branch = true
source = ["uflx", "uflx_basix", "uflx_extensions", "uflx_jax_compiler"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = ["E", "W", "F", "I", "RUF", "UP", "ICN", "NPY", "FLY", "LOG", "ISC"]
# Rule tables bind small local lambdas, and I and l follow the notation of the specification.
ignore = ["E731", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["uflx", "uflx_basix", "uflx_extensions", "uflx_jax_compiler"]

[tool.pyright]
include = ["src/uflx", "src/uflx_extensions"]
exclude = ["src/uflx_jax_compiler", "src/uflx_basix", "test"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
reportUnnecessaryTypeIgnoreComment = "error"
