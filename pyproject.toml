[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "uflx-spec-interpreter"
version = "0.1.0"
description = "A toy implementation of the evaluation passes of the UFLx language specification"
requires-python = ">=3.11"
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest", "pytest-xdist", "coverage"]
lint = ["ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["test"]

[tool.coverage.run]
branch = true
source = ["uflx_spec_interpreter", "uflx_toy", "uflx_oracle"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = ["E", "W", "F", "I", "RUF", "UP", "ICN", "NPY", "FLY", "LOG", "ISC"]
# Rule tables bind small local lambdas, and I and l follow the notation of the specification.
ignore = ["E731", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["uflx_spec_interpreter", "uflx_toy", "uflx_oracle"]
