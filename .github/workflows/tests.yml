name: Unit tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.x']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
      - name: Install LLVM 23 tools for EmitC
        run: |
          curl -fsSLo /tmp/llvm.asc https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo install -m 644 /tmp/llvm.asc /etc/apt/keyrings/llvm.asc
          echo 'deb [signed-by=/etc/apt/keyrings/llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main' | sudo tee /etc/apt/sources.list.d/llvm-23.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mlir-23-tools clang-format-23
          echo /usr/lib/llvm-23/bin >> "$GITHUB_PATH"
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -n 2
