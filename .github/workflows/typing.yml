name: Type checking

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pyrefly:
    name: Strict Pyrefly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[lint]'
      - run: pyrefly check

  dolfinx:
    name: Pyrefly with DOLFINx
    runs-on: ubuntu-latest
    container: ghcr.io/fenics/dolfinx/dolfinx:nightly
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m pip install -e '.[lint]'
      - name: Check the adapter against the installed DOLFINx package
        run: |
          dolfinx_path=$(python3 -c 'from pathlib import Path; import dolfinx; print(Path(dolfinx.__file__).resolve().parent.parent)')
          pyrefly check --search-path src --search-path "$dolfinx_path" 'src/uflx_dolfinx/**/*.py'
