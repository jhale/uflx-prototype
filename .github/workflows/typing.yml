name: Type checking

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pyrefly:
    name: Strict Pyrefly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[lint]'
      - run: pyrefly check
